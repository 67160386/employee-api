openapi: 3.0.3
info:
  title: Employee Microservices API (Gateway)
  description: ระบบจัดการข้อมูลพนักงาน บันทึกเวลาเข้างาน คำขอลา ข้อมูลเสริมภายนอก (Enrichment) และระบบยืนยันตัวตนผ่าน API Gateway
  version: 1.0.0
servers:
  - url: http://localhost:3000
    description: API Gateway Server

paths:
  # ==========================================
  # AUTHENTICATION SERVICE
  # ==========================================
  /api/v1/auth/register:
    post:
      summary: สมัครสมาชิกผู้ใช้งานใหม่
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                  example: user@example.com
                password:
                  type: string
                  format: password
                  example: "P@ssw0rd123"
      responses:
        "201":
          description: สมัครสมาชิกสำเร็จ
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: สมัครสมาชิกสำเร็จ
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                      email:
                        type: string
                      role:
                        type: string
        "400":
          $ref: "#/components/responses/ValidationError"
        "409":
          description: อีเมลซ้ำในระบบ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/auth/login:
    post:
      summary: เข้าสู่ระบบเพื่อรับ JWT Token
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
      responses:
        "200":
          description: เข้าสู่ระบบสำเร็จ
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  token:
                    type: string
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          description: ข้อมูลเข้าสู่ระบบไม่ถูกต้อง
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/auth/me:
    get:
      summary: ดึงข้อมูลโปรไฟล์ผู้ใช้งานปัจจุบันจาก Token
      tags:
        - Authentication
      security:
        - BearerAuth: []
      responses:
        "200":
          description: สำเร็จ
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                      email:
                        type: string
                      role:
                        type: string
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "500":
          $ref: "#/components/responses/InternalError"

  # ==========================================
  # EMPLOYEE SERVICE
  # ==========================================
  /api/v1/employees:
    get:
      summary: ดึงรายการพนักงานทั้งหมด
      tags:
        - Employees
      security:
        - BearerAuth: []
      responses:
        "200":
          description: ดึงข้อมูลพนักงานสำเร็จ
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  total:
                    type: integer
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Employee"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      summary: เพิ่มข้อมูลพนักงานใหม่ (Admin)
      tags:
        - Employees
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - employeeCode
                - name
                - department
              properties:
                employeeCode:
                  type: string
                name:
                  type: string
                department:
                  type: string
      responses:
        "201":
          description: เพิ่มข้อมูลพนักงานสำเร็จ
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  data:
                    $ref: "#/components/schemas/Employee"
        "400":
          $ref: "#/components/responses/ValidationError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "409":
          description: รหัสพนักงานซ้ำในระบบ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/employees/attendance:
    get:
      summary: ดึงประวัติการเข้างานพนักงานทั้งหมด (Admin)
      tags:
        - Employees
      security:
        - BearerAuth: []
      responses:
        "200":
          description: สำเร็จ
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  total:
                    type: integer
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/AttendanceOverview"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/employees/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
    get:
      summary: ดึงข้อมูลพนักงานรายบุคคล
      tags:
        - Employees
      security:
        - BearerAuth: []
      responses:
        "200":
          description: สำเร็จ
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  data:
                    $ref: "#/components/schemas/Employee"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "500":
          $ref: "#/components/responses/InternalError"
    put:
      summary: แก้ไขพนักงาน (Admin)
      tags:
        - Employees
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                employeeCode:
                  type: string
                name:
                  type: string
                department:
                  type: string
      responses:
        "200":
          description: อัปเดตสำเร็จ
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  data:
                    $ref: "#/components/schemas/Employee"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      summary: ลบพนักงาน (Admin)
      tags:
        - Employees
      security:
        - BearerAuth: []
      responses:
        "200":
          description: ลบข้อมูลสำเร็จ
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  employee:
                    $ref: "#/components/schemas/Employee"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/employees/{id}/attendance:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
    get:
      summary: ดึงประวัติการเข้างานรายบุคคล (Admin)
      tags:
        - Employees
      security:
        - BearerAuth: []
      parameters:
        - name: startDate
          in: query
          schema:
            type: string
            format: date
        - name: endDate
          in: query
          schema:
            type: string
            format: date
      responses:
        "200":
          description: สำเร็จ
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  employee:
                    $ref: "#/components/schemas/EmployeeSimple"
                  total:
                    type: integer
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Attendance"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      summary: ลงเวลาเข้างาน (Admin)
      tags:
        - Employees
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - work_date
                - check_in
              properties:
                work_date:
                  type: string
                  format: date
                check_in:
                  type: string
                check_out:
                  type: string
                status:
                  type: string
                  enum: [ON_TIME, LATE]
      responses:
        "201":
          description: บันทึกเวลาเข้างานสำเร็จ
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  employee:
                    $ref: "#/components/schemas/EmployeeSimple"
                  data:
                    $ref: "#/components/schemas/Attendance"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "409":
          description: บันทึกเวลาซ้ำ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/employees/{employee_id}/attendance/{attendance_id}:
    parameters:
      - name: employee_id
        in: path
        required: true
        schema:
          type: integer
      - name: attendance_id
        in: path
        required: true
        schema:
          type: integer
    patch:
      summary: แก้ไขประวัติการลงเวลา (Admin)
      tags:
        - Employees
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                check_in:
                  type: string
                check_out:
                  type: string
                status:
                  type: string
      responses:
        "200":
          description: สำเร็จ
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/employees/{id}/leave-requests:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
    get:
      summary: ดึงประวัติการลารายบุคคล
      tags:
        - Employees
      security:
        - BearerAuth: []
      responses:
        "200":
          description: สำเร็จ
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  employee_id:
                    type: integer
                  employee_name:
                    type: string
                  total:
                    type: integer
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/LeaveRequestItem"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      summary: ยื่นคำขอลา
      tags:
        - Employees
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - leave_type
                - start_date
                - end_date
              properties:
                leave_type:
                  type: string
                  enum: [SICK, PERSONAL, VACATION]
                start_date:
                  type: string
                  format: date
                end_date:
                  type: string
                  format: date
                reason:
                  type: string
      responses:
        "201":
          description: ยื่นคำขอลาสำเร็จ
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  data:
                    $ref: "#/components/schemas/LeaveRequestItem"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/employees/{id}/enrichment:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
    get:
      summary: ข้อมูลเสริมจาก External API
      tags:
        - Employees
      security:
        - BearerAuth: []
      responses:
        "200":
          description: สำเร็จ
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      employeeId:
                        type: string
                      enrichment:
                        type: object
        "500":
          $ref: "#/components/responses/InternalError"

  # ==========================================
  # LEAVE REQUESTS SERVICE
  # ==========================================
  /api/v1/leave-requests:
    get:
      summary: ดึงรายการคำขอลาทั้งหมด (Admin)
      tags:
        - Leave Requests
      security:
        - BearerAuth: []
      responses:
        "200":
          description: สำเร็จ
          content:
            application/json:
              schema:
                type: object
                properties:
                  total:
                    type: integer
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/LeaveRequestOverview"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/leave-requests/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
    patch:
      summary: อนุมัติ/ปฏิเสธคำขอลา (Admin)
      tags:
        - Leave Requests
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - status
              properties:
                status:
                  type: string
                  enum: [APPROVED, REJECTED]
      responses:
        "200":
          description: สำเร็จ
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                      status:
                        type: string
        "400":
          $ref: "#/components/responses/BadRequestError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "500":
          $ref: "#/components/responses/InternalError"

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: รูปแบบ `Bearer <token>`

  schemas:
    Employee:
      type: object
      properties:
        id:
          type: integer
        employeeCode:
          type: string
        name:
          type: string
        department:
          type: string

    EmployeeSimple:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        department:
          type: string

    Attendance:
      type: object
      properties:
        id:
          type: integer
        employee_id:
          type: integer
        work_date:
          type: string
          format: date
        check_in:
          type: string
        check_out:
          type: string
        status:
          type: string

    AttendanceOverview:
      type: object
      properties:
        id:
          type: integer
        employee_id:
          type: integer
        employeeCode:
          type: string
        employee_name:
          type: string
        department:
          type: string
        work_date:
          type: string
          format: date
        check_in:
          type: string
        check_out:
          type: string
        status:
          type: string

    LeaveRequestOverview:
      type: object
      properties:
        id:
          type: integer
        employee_id:
          type: integer
        employeeCode:
          type: string
        employee_name:
          type: string
        department:
          type: string
        leave_type:
          type: string
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
        reason:
          type: string
        status:
          type: string
        created_at:
          type: string
          format: date-time

    LeaveRequestItem:
      type: object
      properties:
        id:
          type: integer
        employee_id:
          type: integer
        leave_type:
          type: string
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
        reason:
          type: string
        status:
          type: string
        created_at:
          type: string
          format: date-time

    ErrorDetail:
      type: object
      properties:
        code:
          type: string
        message:
          type: string

    ErrorResponse:
      type: object
      properties:
        error:
          $ref: "#/components/schemas/ErrorDetail"

  responses:
    NotFoundError:
      description: ไม่พบข้อมูลที่ระบุ
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    BadRequestError:
      description: คำขอไม่ถูกต้องหรือข้อมูลไม่ครบถ้วน
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ValidationError:
      description: ข้อมูล validation ไม่ผ่าน
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    UnauthorizedError:
      description: ไม่พบ Token หรือ Token ไม่ถูกต้อง/หมดอายุ
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ForbiddenError:
      description: ไม่มีสิทธิ์เข้าถึง (Forbidden)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InternalError:
      description: ข้อผิดพลาดภายในระบบ
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
