openapi: 3.0.3
info:
  title: Employee API
  description: ระบบจัดการข้อมูลพนักงาน บันทึกเวลาเข้างาน คำขอลา ข้อมูลเสริมภายนอก (Enrichment) และระบบยืนยันตัวตน (Authentication & Authorization)
  version: 1.0.0
servers:
  - url: http://localhost:3000
    description: Local Development Server

paths:
  /:
    get:
      summary: ตรวจสอบสถานะการทำงานของ API
      responses:
        "200":
          description: Service พร้อมใช้งาน
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Employee API พร้อมใช้งาน

  # ==========================================
  # AUTHENTICATION
  # ==========================================
  /api/v1/auth/register:
    post:
      summary: สมัครสมาชิกผู้ใช้งานใหม่
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                  example: user@example.com
                password:
                  type: string
                  format: password
                  example: "P@ssw0rd123"
      responses:
        "201":
          description: สมัครสมาชิกสำเร็จ
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: สมัครสมาชิกสำเร็จ
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 1
                      email:
                        type: string
                        example: user@example.com
                      role:
                        type: string
                        example: employee
        "400":
          $ref: "#/components/responses/ValidationError"
        "409":
          description: อีเมลซ้ำในระบบ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error:
                  code: DUPLICATE_EMAIL
                  message: อีเมลนี้มีอยู่ในระบบแล้ว
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/auth/login:
    post:
      summary: เข้าสู่ระบบเพื่อรับ JWT Token
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                  example: user@example.com
                password:
                  type: string
                  format: password
                  example: "P@ssw0rd123"
      responses:
        "200":
          description: เข้าสู่ระบบสำเร็จ
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: เข้าสู่ระบบสำเร็จ
                  token:
                    type: string
                    example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          description: ข้อมูลเข้าสู่ระบบไม่ถูกต้อง
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error:
                  code: INVALID_CREDENTIALS
                  message: อีเมลหรือรหัสผ่านไม่ถูกต้อง
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/auth/me:
    get:
      summary: ดึงข้อมูลโปรไฟล์ผู้ใช้งานปัจจุบันจาก Token
      tags:
        - Authentication
      security:
        - BearerAuth: []
      responses:
        "200":
          description: สำเร็จ
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: สำเร็จ
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 1
                      email:
                        type: string
                        example: user@example.com
                      role:
                        type: string
                        example: employee
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "500":
          $ref: "#/components/responses/InternalError"

  # ==========================================
  # EMPLOYEES & RELATED SUB-RESOURCES
  # ==========================================
  /api/v1/employees:
    get:
      summary: ดึงรายการพนักงานทั้งหมด
      tags:
        - Employees
      security:
        - BearerAuth: []
      responses:
        "200":
          description: ดึงข้อมูลพนักงานสำเร็จ
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: ดึงข้อมูลพนักงานสำเร็จ
                  total:
                    type: integer
                    example: 2
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Employee"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      summary: เพิ่มข้อมูลพนักงานใหม่ (Admin Only)
      tags:
        - Employees
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - employeeCode
                - name
                - department
              properties:
                employeeCode:
                  type: string
                  example: EMP001
                name:
                  type: string
                  example: สมชาย ใจดี
                department:
                  type: string
                  example: IT
      responses:
        "201":
          description: เพิ่มข้อมูลพนักงานสำเร็จ
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: เพิ่มข้อมูลพนักงานสำเร็จ
                  data:
                    $ref: "#/components/schemas/Employee"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "409":
          description: รหัสพนักงานซ้ำในระบบ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error:
                  code: DUPLICATE_ENTRY
                  message: รหัสพนักงานนี้มีอยู่ในระบบแล้ว
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/employees/attendance:
    get:
      summary: ดึงประวัติการเข้างานของพนักงานทั้งหมด (Admin Only)
      tags:
        - Employees
      security:
        - BearerAuth: []
      responses:
        "200":
          description: ดึงข้อมูลการเข้างานพนักงานทั้งหมดสำเร็จ
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: ดึงข้อมูลการเข้างานพนักงานทั้งหมดสำเร็จ
                  total:
                    type: integer
                    example: 1
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/AttendanceOverview"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/employees/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: รหัส ID ของพนักงาน
        schema:
          type: integer
          example: 1
    get:
      summary: ดึงข้อมูลพนักงานเฉพาะรายบุคคล
      tags:
        - Employees
      security:
        - BearerAuth: []
      responses:
        "200":
          description: ดึงข้อมูลพนักงานสำเร็จ
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: ดึงข้อมูลพนักงานสำเร็จ
                  data:
                    $ref: "#/components/schemas/Employee"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "500":
          $ref: "#/components/responses/InternalError"
    put:
      summary: แก้ไขข้อมูลพนักงานทั้งระเบียนเฉพาะรายบุคคล (Admin Only)
      tags:
        - Employees
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - department
              properties:
                name:
                  type: string
                  example: สมชาย มีสุข
                department:
                  type: string
                  example: HR
      responses:
        "200":
          description: อัปเดตข้อมูลพนักงานสำเร็จ
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: อัปเดตข้อมูลพนักงานสำเร็จ
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 1
                      name:
                        type: string
                        example: สมชาย มีสุข
                      department:
                        type: string
                        example: HR
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      summary: ลบข้อมูลพนักงานเฉพาะรายบุคคล (Admin Only)
      tags:
        - Employees
      security:
        - BearerAuth: []
      responses:
        "200":
          description: ลบข้อมูลพนักงานสำเร็จ
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: ลบข้อมูลพนักงานสำเร็จ
                  employee:
                    $ref: "#/components/schemas/Employee"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/employees/{id}/attendance:
    parameters:
      - name: id
        in: path
        required: true
        description: รหัส ID ของพนักงาน
        schema:
          type: integer
          example: 1
    get:
      summary: ดึงประวัติการเข้างานของพนักงานเฉพาะรายบุคคล (Admin Only)
      tags:
        - Employees
      security:
        - BearerAuth: []
      parameters:
        - name: startDate
          in: query
          required: false
          description: วันที่เริ่มต้น (YYYY-MM-DD)
          schema:
            type: string
            format: date
            example: 2026-10-01
        - name: endDate
          in: query
          required: false
          description: วันที่สิ้นสุด (YYYY-MM-DD)
          schema:
            type: string
            format: date
            example: 2026-10-10
      responses:
        "200":
          description: ดึงข้อมูลการเข้างานพนักงานสำเร็จ
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: ดึงข้อมูลการเข้างานพนักงานสำเร็จ
                  employee:
                    $ref: "#/components/schemas/EmployeeSimple"
                  total:
                    type: integer
                    example: 1
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Attendance"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      summary: บันทึกเวลาเข้างานของพนักงานเฉพาะรายบุคคล (Admin Only)
      tags:
        - Employees
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - work_date
                - check_in
              properties:
                work_date:
                  type: string
                  format: date
                  example: 2026-10-10
                check_in:
                  type: string
                  example: "08:30:00"
                check_out:
                  type: string
                  nullable: true
                  example: "17:30:00"
                status:
                  type: string
                  enum: [ON_TIME, LATE]
                  default: ON_TIME
                  example: ON_TIME
      responses:
        "201":
          description: บันทึกเวลาเข้างานสำเร็จ
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: บันทึกเวลาเข้างานสำเร็จ
                  employee:
                    $ref: "#/components/schemas/EmployeeSimple"
                  data:
                    $ref: "#/components/schemas/Attendance"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "409":
          description: บันทึกเวลาเข้างานของวันนี้ซ้ำ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error:
                  code: DUPLICATE_ATTENDANCE
                  message: พนักงานคนนี้ได้บันทึกเวลาเข้างานวันนี้ไปแล้ว
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/employees/{id}/leave-requests:
    parameters:
      - name: id
        in: path
        required: true
        description: รหัส ID ของพนักงาน
        schema:
          type: integer
          example: 1
    get:
      summary: ดึงประวัติการลาของพนักงานเฉพาะรายบุคคล (Admin Only)
      tags:
        - Employees
      security:
        - BearerAuth: []
      responses:
        "200":
          description: ดึงข้อมูลประวัติการลาสำเร็จ
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: ดึงข้อมูลประวัติการลาสำเร็จ
                  employee_id:
                    type: integer
                    example: 1
                  employee_name:
                    type: string
                    example: สมชาย ใจดี
                  total:
                    type: integer
                    example: 1
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/LeaveRequestItem"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      summary: ยื่นคำขอลาของพนักงานเฉพาะรายบุคคล
      tags:
        - Employees
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - leave_type
                - start_date
                - end_date
              properties:
                leave_type:
                  type: string
                  enum: [SICK, PERSONAL, VACATION]
                  example: SICK
                start_date:
                  type: string
                  format: date
                  example: 2026-10-15
                end_date:
                  type: string
                  format: date
                  example: 2026-10-16
                reason:
                  type: string
                  nullable: true
                  example: ป่วยเป็นไข้หวัด
      responses:
        "201":
          description: ยื่นคำขอลาเรียบร้อยแล้ว
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: ยื่นคำขอลาเรียบร้อยแล้ว
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 5
                      employee_id:
                        type: integer
                        example: 1
                      leave_type:
                        type: string
                        example: SICK
                      start_date:
                        type: string
                        format: date
                        example: 2026-10-15
                      end_date:
                        type: string
                        format: date
                        example: 2026-10-16
                      reason:
                        type: string
                        nullable: true
                        example: ป่วยเป็นไข้หวัด
                      status:
                        type: string
                        example: PENDING
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/employees/{id}/enrichment:
    parameters:
      - name: id
        in: path
        required: true
        description: รหัส ID ของพนักงาน
        schema:
          type: integer
          example: 1
    get:
      summary: ข้อมูลเสริมจาก Public API ภายนอก พร้อม Retry/Timeout/Fallback
      tags:
        - Employees
      security:
        - BearerAuth: []
      responses:
        "200":
          description: ดึงข้อมูลเสริมสำเร็จ
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      employeeId:
                        type: string
                        example: "1"
                      enrichment:
                        type: object
                        description: ข้อมูลที่ enrich มาจากบริการภายนอก
                        additionalProperties: true
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/employees/{employee_id}/attendance/{attendance_id}:
    parameters:
      - name: employee_id
        in: path
        required: true
        description: รหัส ID ของพนักงาน
        schema:
          type: integer
          example: 1
      - name: attendance_id
        in: path
        required: true
        description: รหัส ID ของรายการลงเวลา
        schema:
          type: integer
          example: 10
    patch:
      summary: แก้ไขข้อมูลการลงเวลาของพนักงานเฉพาะรายบุคคล (Admin Only)
      tags:
        - Employees
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                check_in:
                  type: string
                  example: "08:45:00"
                check_out:
                  type: string
                  example: "17:45:00"
                status:
                  type: string
                  example: LATE
      responses:
        "200":
          description: อัปเดตข้อมูลการลงเวลาเรียบร้อย
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: อัปเดตข้อมูลการลงเวลาเรียบร้อย
                  employee:
                    $ref: "#/components/schemas/EmployeeSimple"
                  data:
                    $ref: "#/components/schemas/Attendance"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "500":
          $ref: "#/components/responses/InternalError"

  # ==========================================
  # LEAVE REQUESTS OVERVIEW & APPROVAL
  # ==========================================
  /api/v1/leave-requests:
    get:
      summary: ดึงรายการคำขอลาของพนักงานทั้งหมด (Admin Only)
      tags:
        - Leave Requests
      security:
        - BearerAuth: []
      responses:
        "200":
          description: ดึงข้อมูลคำขอลาสำเร็จ
          content:
            application/json:
              schema:
                type: object
                properties:
                  total:
                    type: integer
                    example: 1
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/LeaveRequestOverview"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/leave-requests/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: รหัส ID ของคำขอลา
        schema:
          type: integer
          example: 5
    patch:
      summary: อนุมัติหรือปฏิเสธคำขอลา (Admin Only)
      tags:
        - Leave Requests
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - status
              properties:
                status:
                  type: string
                  enum: [APPROVED, REJECTED]
                  example: APPROVED
      responses:
        "200":
          description: อัปเดตสถานะคำขอลาสำเร็จ
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: อัปเดตสถานะคำขอลาเป็น APPROVED เรียบร้อยแล้ว
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 5
                      status:
                        type: string
                        example: APPROVED
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "500":
          $ref: "#/components/responses/InternalError"

# ==========================================
# COMPONENTS & SCHEMAS
# ==========================================
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: ส่งค่า JWT Token ใน Header รูปแบบ `Bearer <token>`

  schemas:
    Employee:
      type: object
      properties:
        id:
          type: integer
          example: 1
        employeeCode:
          type: string
          example: EMP001
        name:
          type: string
          example: สมชาย ใจดี
        department:
          type: string
          example: IT

    EmployeeSimple:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: สมชาย ใจดี
        department:
          type: string
          example: IT

    Attendance:
      type: object
      properties:
        id:
          type: integer
          example: 1
        attendance_id:
          type: integer
          example: 10
        employee_id:
          type: integer
          example: 1
        work_date:
          type: string
          format: date
          example: 2026-10-10
        check_in:
          type: string
          example: "08:30:00"
        check_out:
          type: string
          nullable: true
          example: "17:30:00"
        status:
          type: string
          example: ON_TIME

    AttendanceOverview:
      type: object
      properties:
        id:
          type: integer
          example: 1
        employee_id:
          type: integer
          example: 1
        employeeCode:
          type: string
          example: EMP001
        employee_name:
          type: string
          example: สมชาย ใจดี
        department:
          type: string
          example: IT
        work_date:
          type: string
          format: date
          example: 2026-10-10
        check_in:
          type: string
          example: "08:30:00"
        check_out:
          type: string
          nullable: true
          example: "17:30:00"
        status:
          type: string
          example: ON_TIME

    LeaveRequestOverview:
      type: object
      properties:
        id:
          type: integer
          example: 1
        employee_id:
          type: integer
          example: 1
        employeeCode:
          type: string
          example: EMP001
        employee_name:
          type: string
          example: สมชาย ใจดี
        department:
          type: string
          example: IT
        leave_type:
          type: string
          example: SICK
        start_date:
          type: string
          format: date
          example: 2026-10-15
        end_date:
          type: string
          format: date
          example: 2026-10-16
        reason:
          type: string
          nullable: true
          example: ป่วย
        status:
          type: string
          example: PENDING
        created_at:
          type: string
          format: date-time

    LeaveRequestItem:
      type: object
      properties:
        id:
          type: integer
          example: 1
        leave_type:
          type: string
          example: SICK
        start_date:
          type: string
          format: date
          example: 2026-10-15
        end_date:
          type: string
          format: date
          example: 2026-10-16
        reason:
          type: string
          nullable: true
          example: ป่วย
        status:
          type: string
          example: PENDING
        created_at:
          type: string
          format: date-time

    ErrorDetail:
      type: object
      properties:
        code:
          type: string
          example: NOT_FOUND
        message:
          type: string
          example: ไม่พบข้อมูลที่ต้องการ

    ErrorResponse:
      type: object
      properties:
        error:
          $ref: "#/components/schemas/ErrorDetail"

  responses:
    NotFoundError:
      description: ไม่พบข้อมูลที่ระบุ
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: NOT_FOUND
              message: ไม่พบข้อมูลพนักงาน
    BadRequestError:
      description: คำขอไม่ถูกต้องหรือข้อมูลไม่ครบถ้วน
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: BAD_REQUEST
              message: กรุณากรอกข้อมูลให้ครบถ้วน
    ValidationError:
      description: ข้อมูล validation ไม่ผ่าน
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: VALIDATION_ERROR
              message: กรุณาระบุข้อมูลให้ครบถ้วน
    UnauthorizedError:
      description: ไม่พบ Token หรือ Token ไม่ถูกต้อง/หมดอายุ
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: UNAUTHORIZED
              message: กรุณาเข้าสู่ระบบก่อนใช้งาน
    ForbiddenError:
      description: ไม่มีสิทธิ์เข้าถึงเส้นทางนี้ (ต้องใช้สิทธิ์ Admin)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: FORBIDDEN
              message: คุณไม่มีสิทธิ์ในการดำเนินการนี้
    InternalError:
      description: ข้อผิดพลาดภายในระบบเซิร์ฟเวอร์
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: INTERNAL_ERROR
              message: เกิดข้อผิดพลาดภายในระบบ
